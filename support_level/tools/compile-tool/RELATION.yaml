schema_version: 1
id: compile-tool
type: host_tool
human_doc: USAGE.md
owner: compile

summary: 统一编译执行入口；观察软件状态，由 LLM 声明重编范围，并阻断越界组件和未声明的 destructive 操作。

execution:
  executable: ./compile-tool

relations:
  projects:
    - imx-oei
    - imx-atf
    - uboot-imx
    - real-time-edge-uboot
    - imx-optee-os
    - imx-sm
    - imx-mkimage
  compile_targets:
    - flashbin
    - linux
    - m_freertos_sdk
    - zephyr
    - a55_rtos
  software_stacks: []
  release_packages: []
  boards: []
  tools: []

case_required_for:
  - compile_execution

warnings:
  - The tool validates request shape and configured parameter guards, but does not parse Makefiles or generate project recipes.
  - Component parameter guards are loaded from COMPILE_POLICY.yaml next to compile targets, projects, or workspaces.
  - Managed Git sources are immutable build identities: writable source-tree cwd is blocked unless policy selects an isolated_git execution copy.
  - Every real compile command in the normal workspace workflow must pass through prepare and run.
  - The complete prepare report and raw commands must be shown to the user before run.
  - OEI and imx-mkimage silicon revision must come from the user and be explicit as REV in guarded make commands.
  - Parameters without a configured guard may be omitted or recorded as assumptions/defaults.
  - Assess reports state evidence only; the LLM declares decision.scope and reason.
  - Schema v2 units may include only declared scope components and explicit downstream dependencies.
  - Standard clean targets and recursive forced deletion require an explicit destructive reason unless a component policy owns the sequence.
  - SMFW rebuilds must remove only configs/<smfw_config>, then run really-clean, cfg, and all in order.
  - Generic targets propagate only dependencies explicitly declared in the manifest.
  - Checklist-enabled projects use one case compile.yaml as the public prepare/run input; internal manifests, commands, and requests are tool-owned.
  - M SDK uses a multi-job public compile.yaml; source builds publish ELF and BIN, while controlled imports only validate, copy, and publish.
  - imx-mkimage recipe input roles and staging destinations are constrained by the versioned recipe matrix.
  - Known AHAB and DDR fixed assets are constrained by role, destination, and SHA-256 in the fixed asset matrix.
  - Cross-manifest artifacts require same-case producer success state, matching content hash, type, and declared identity parameters.
  - imx-mkimage M payload slots accept only nxp.mcore.bin from a successful M SDK producer with matching SoC and core role.
  - One request still executes one manifest; producer-to-consumer orchestration remains explicit.
  - managed_git_set is not a workspace lock and the tool does not parse west manifests.
  - managed_git_set currently supports external out-of-tree execution only; isolated multi-repository workspaces are not implemented.
  - software-state.yaml is generated by the tool and must not be maintained by the LLM.
  - Command hashes are not stored; flashbin records upstream input artifact hashes for later verification.
  - External source and release-package downloads are not automatic.
  - This remains a workspace convention and does not block deliberate direct use of host build binaries.

evidence:
  - USAGE.md
  - REQUEST_SCHEMA.md
  - SOFTWARE_STATE_SCHEMA.md
  - PROJECT_PROFILE_SCHEMA.md
  - MINIMAL_CHECKLIST_DESIGN.md
  - ../../compile_targets/m_freertos_sdk/COMPILE_CHECKLIST.yaml
  - ../../release_packages/m_freertos_sdk/PACKAGES.yaml
  - ../../compile_targets/flashbin/COMPILE_POLICY.yaml
  - ../../compile_targets/flashbin/DEPENDENCIES.yaml
  - ../../compile_targets/flashbin/RECIPE_CONTRACTS.yaml
  - ../../compile_targets/flashbin/FIXED_ASSETS.yaml
