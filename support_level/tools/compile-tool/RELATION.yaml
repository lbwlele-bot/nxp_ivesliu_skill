schema_version: 1
id: compile-tool
type: host_tool
human_doc: USAGE.md
owner: compile

summary: 统一编译执行入口；对 flashbin 额外强制本地源码解析、软件状态评估和最小重编动作。

execution:
  executable: ./compile-tool

relations:
  projects: []
  compile_targets:
    - flashbin
    - linux
    - m_freertos_sdk
    - zephyr
    - a55_rtos
  software_stacks: []
  release_packages: []
  boards: []
  tools: []

case_required_for:
  - compile_execution

warnings:
  - The tool validates request shape and command identity, but does not parse Makefiles or generate project recipes.
  - Every real compile command in the normal workspace workflow must pass through prepare and hash-bound run.
  - The complete prepare report and raw commands must be shown to the user before run.
  - Flashbin must pass assess and bind the exact REBUILD/REPACK set before prepare.
  - software-state.yaml is generated by the tool and must not be maintained by the LLM.
  - External source and release-package downloads are not automatic.
  - This remains a workspace convention and does not block deliberate direct use of host build binaries.

evidence:
  - USAGE.md
  - REQUEST_SCHEMA.md
  - SOFTWARE_STATE_SCHEMA.md
  - ../../compile_targets/flashbin/DEPENDENCIES.yaml
