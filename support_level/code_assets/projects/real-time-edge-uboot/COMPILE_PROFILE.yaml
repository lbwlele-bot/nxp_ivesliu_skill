schema_version: 1
id: real-time-edge-uboot
type: project_compile
target: real-time-edge-uboot
component: real-time-edge-uboot
action: rebuild

source:
  id: real-time-edge-uboot
  path: real-time-edge-uboot
  case_path: sources/real-time-edge-uboot
  ref_kind: tag
  remote: origin
  remote_url: https://github.com/nxp-real-time-edge-sw/real-time-edge-uboot.git
  update: if_missing

parameters:
  defconfig:
    source: user
    required: true
    pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*_defconfig$'
  jobs:
    source: project
    default: 8
    pattern: '^[1-9][0-9]*$'

configuration_parameters: [defconfig, jobs]

tools:
  - name: make
    path: /usr/bin/make
    version_args: [--version]
  - name: compiler
    path: toolchain/arm-gnu-toolchain-14.3.rel1-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-gcc
    version_args: [--version]

watched_inputs: []

outputs:
  uboot_bin:
    type: nxp.uboot.u-boot-bin
    path: artifacts/real-time-edge-uboot/u-boot.bin
    identity_parameters: [defconfig]
  uboot_spl:
    type: nxp.uboot.spl
    path: artifacts/real-time-edge-uboot/u-boot-spl.bin
    identity_parameters: [defconfig]

artifact_inputs: {}
file_inputs: {}

checklist_build:
  mode: isolated_git
  env: {}
  steps:
    - name: configure-real-time-edge-uboot
      command:
        - ${tools.make}
        - CROSS_COMPILE=${tool_prefix.compiler}
        - O=build
        - ${parameters.defconfig}
    - name: build-real-time-edge-uboot
      command:
        - ${tools.make}
        - CROSS_COMPILE=${tool_prefix.compiler}
        - O=build
        - -j${parameters.jobs}
