# 仅演示清单结构；当前本地旧源码线不能作为 i.MX9 RTE 验证依据。
schema_version: 1
kind: project_compile_checklist
project: real-time-edge-uboot

case_root: /home/ives/桌面/NXP_v2/support_level/work/example-rte-uboot
source:
  ref: Real-Time-Edge-v2.0-baremetal-202107

parameters:
  defconfig: imx8qm_mek_defconfig
  jobs: 8

inputs:
  artifacts: []
  files: []

toolchain:
  make: /usr/bin/make
  compiler: toolchain/arm-gnu-toolchain-14.3.rel1-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-gcc

intent:
  action: rebuild
  reason: 演示被软件栈明确选中的 RTE U-Boot 源码线清单结构

build:
  mode: isolated_git

outputs:
  uboot_bin:
    type: nxp.uboot.u-boot-bin
    collect_from: build/u-boot.bin
    publish_to: artifacts/real-time-edge-uboot/u-boot.bin
  uboot_spl:
    type: nxp.uboot.spl
    collect_from: build/spl/u-boot-spl.bin
    publish_to: artifacts/real-time-edge-uboot/u-boot-spl.bin
