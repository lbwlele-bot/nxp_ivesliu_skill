  files: []

toolchain:
  make: /usr/bin/make
  compiler32: toolchain/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi/bin/arm-none-eabi-gcc
  compiler64: toolchain/arm-gnu-toolchain-14.3.rel1-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-gcc

intent:
  action: rebuild
  reason: 为 i.MX95 secure-world 链路生成 tee.bin

build:
  mode: isolated_git

outputs:
  tee:
    type: nxp.optee.image
    collect_from: out/arm-plat-${parameters.platform}/core/tee-raw.bin
    publish_to: artifacts/imx-optee-os/tee.bin
