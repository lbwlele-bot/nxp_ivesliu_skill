# 通用 NXP U-Boot 项目编译清单模板。命令由 profile 生成。
schema_version: 1
kind: project_compile_checklist
project: uboot-imx

case_root: TBD
source:
  ref: TBD

parameters:
  defconfig: TBD
  jobs: 8

inputs:
  artifacts: []
  files: []

toolchain:
  make: /usr/bin/make
  compiler: toolchain/arm-gnu-toolchain-14.3.rel1-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-gcc

intent:
  action: rebuild
  reason: TBD

build:
  mode: isolated_git

outputs:
  uboot_bin:
    type: nxp.uboot.u-boot-bin
    collect_from: build/u-boot.bin
    publish_to: artifacts/uboot-imx/u-boot.bin
  uboot_spl:
    type: nxp.uboot.spl
    collect_from: build/spl/u-boot-spl.bin
    publish_to: artifacts/uboot-imx/u-boot-spl.bin
